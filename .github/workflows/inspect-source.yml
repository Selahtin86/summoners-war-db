name: Inspect monster source

on:
  push:
    branches: [main]
    paths:
      - "inspect_source.py"
      - ".github/workflows/inspect-source.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python inspect_source.py
